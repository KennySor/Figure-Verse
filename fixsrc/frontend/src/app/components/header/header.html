<div class="topbar">
  <span>⚡ <b>DROP NUEVO</b> cada semana</span>
  <span>◈ Envío blindado para coleccionistas</span>
  <span>✓ 100% piezas originales</span>
  <span>▣ Preventas con reserva segura</span>
</div>

<header>
  <a routerLink="/" class="brand" aria-label="Figureverse inicio" (click)="closeMenu()">
    <span class="logo">
      <svg viewBox="0 0 32 32"><path d="M16 2 28 8.7v14.6L16 30 4 23.3V8.7L16 2Zm0 5.1L8.6 11v10L16 25.2l7.4-4.2V11L16 7.1Zm0 4.5 3.4 4.4-3.4 4.4-3.4-4.4 3.4-4.4Z"/></svg>
    </span>
    <span class="brand-name">FIGURE<span>VERSE</span></span>
  </a>

  <nav [class.open]="isMenuOpen">
    <ul>
      <li><a routerLink="/" class="active" (click)="closeMenu()">Inicio</a></li>
      <li><a routerLink="/productos" (click)="closeMenu()">Universos</a></li>
      <li><a routerLink="/productos" (click)="closeMenu()">Figuras</a></li>
      <li><a routerLink="/productos" (click)="closeMenu()">Ofertas</a></li>
      <li><a routerLink="/productos" (click)="closeMenu()">Preventas</a></li>
      <li><a routerLink="/productos" (click)="closeMenu()">Exclusivos</a></li>
    </ul>
  </nav>

  <div class="header-actions">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="searchInput" name="searchInput" type="search" placeholder="Buscar figuras..." autocomplete="off">
    </label>
    <button class="icon-btn" aria-label="Favoritos">
      <svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5-8.8 10.3-8.8 10.3S3.2 13.8 3.2 8.8A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.8Z"/></svg>
    </button>
    <button class="icon-btn" aria-label="Carrito" id="cartButton">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.6L21 7H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
    <button class="login">MI CUENTA</button>
  </div>
  <button class="menu" aria-label="Menú" (click)="toggleMenu()">☰</button>
</header>
