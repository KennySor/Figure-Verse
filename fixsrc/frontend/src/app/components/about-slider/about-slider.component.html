<section class="slider" (mouseenter)="detenerAutoplay()" (mouseleave)="iniciarAutoplay()">
    <button class="flecha izq" type="button" (click)="anterior()" aria-label="Anterior">‹</button>

    <div class="pista">
        @for (s of slides; track s.etiqueta; let i = $index) {
        <article class="slide" [class.activa]="i === actual">
            <span class="etiqueta">{{ s.etiqueta }}</span>
            <h2 class="titulo">{{ s.titulo }}</h2>
            <p class="texto">{{ s.texto }}</p>
        </article>
        }
    </div>

    <button class="flecha der" type="button" (click)="siguiente()" aria-label="Siguiente">›</button>

    <div class="indicadores">
        @for (s of slides; track s.etiqueta; let i = $index) {
        <button type="button" class="punto" [class.activo]="i === actual" (click)="irA(i)"
            [attr.aria-label]="'Ir a la diapositiva ' + (i + 1)"></button>
        }
    </div>
</section>
